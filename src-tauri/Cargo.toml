[package]
name = "myclean"
version = "1.0.0"
description = "myclean - High-Performance Privacy-First macOS Cleaner"
authors = ["myclean Studio"]
edition = "2021"

[lib]
name = "myclean_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
walkdir = "2.5"
trash = "5.2"
rusqlite = { version = "0.33", features = ["bundled"] }
blake3 = "1.8"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
dirs = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
